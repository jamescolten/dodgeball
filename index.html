<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playground Dodgeball Simulator</title>
<style>
:root{--sage:#c9d8b6;--red:#d64545;--blue:#3b6fd6;--ink:#2b3327}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2e8;color:var(--ink)}
header{padding:12px 20px}
h1{font-size:20px;margin:0}
.screen{display:none;padding:0 20px 20px}
.screen.active{display:block}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid #8a9a7c;background:#fff;cursor:pointer}
button:hover{background:#f3f7ee}
button.on{background:var(--ink);color:#fff}
button:disabled{opacity:.5;cursor:default}
#draftStatus{font-weight:600;margin:6px 0 12px;font-size:16px}
.draftWrap{display:grid;grid-template-columns:200px 1fr 200px;gap:16px}
.teamCol h3{margin:0 0 8px}
.teamCol.red h3{color:var(--red)}.teamCol.blue h3{color:var(--blue)}
.roster div{padding:5px 8px;margin-bottom:4px;border-radius:4px;background:#fff;font-size:14px;cursor:default}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:#fff;border-radius:8px;padding:10px;border:2px solid transparent;font-size:12px}
.pool .card.pickable{cursor:pointer}
.pool .card.pickable:hover{border-color:var(--red)}
.card .nm{font-weight:700;font-size:14px}
.card .tag{color:#667;margin-bottom:6px}
.stat{display:flex;align-items:center;justify-content:space-between;margin:2px 0}
.pips span{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:2px;background:#e3e7de}
.pips span.f{background:var(--ink)}
.controls{display:flex;gap:6px;margin:8px 0;align-items:center;flex-wrap:wrap}
.gameWrap{display:grid;grid-template-columns:1000px minmax(260px,1fr);gap:16px}
canvas{display:block;border-radius:8px}
#log{background:#fff;border-radius:8px;padding:8px;height:620px;overflow-y:auto;font-size:13px}
#log div{padding:3px 0;border-bottom:1px solid #eef0ea}
#log .t{color:#889;margin-right:6px;font-variant-numeric:tabular-nums}
#tip{position:fixed;pointer-events:none;display:none;z-index:10;width:220px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#overlay{position:fixed;inset:0;background:rgba(30,40,25,.55);display:none;align-items:center;justify-content:center;z-index:5}
#overlay .box{background:#fff;border-radius:10px;padding:20px;max-width:780px;width:92%;max-height:90vh;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:12px}
th,td{padding:4px 6px;text-align:center;border-bottom:1px solid #eee}
td:first-child,th:first-child{text-align:left}
.setupGrid{display:grid;grid-template-columns:repeat(3,minmax(240px,320px));gap:16px;margin:8px 0 16px}
.setupBox{background:#fff;border-radius:8px;padding:14px}
.setupBox h3{margin:0 0 10px}
.setupBox label{display:block;margin:8px 0 4px;font-size:14px}
.setupBox input{font:inherit;padding:5px 8px;border:1px solid #b8c4ad;border-radius:6px;width:100%;margin-top:4px}
.hint{font-size:12px;color:#667;margin-top:4px}
.swatches{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #b8c4ad}
.swatches button.sel{box-shadow:0 0 0 3px var(--ink)}
.swatches button:disabled{opacity:.25}
.err{color:#b3261e;font-size:14px;min-height:20px;margin-bottom:8px}
</style>
</head>
<body>
<header><h1>Playground Dodgeball Simulator</h1></header>

<section id="setup" class="screen active">
  <div class="setupGrid">
    <div class="setupBox"><h3>Your captain</h3>
      <label>Name<input id="youName" value="Riley" maxlength="14"></label>
      <div class="swatches" id="youColors"></div><div class="hint" id="youColorName"></div>
    </div>
    <div class="setupBox"><h3>CPU captain</h3>
      <label>Name<input id="cpuName" value="Blake" maxlength="14"></label>
      <div class="swatches" id="cpuColors"></div><div class="hint" id="cpuColorName"></div>
    </div>
    <div class="setupBox"><h3>Teams</h3>
      <label>Players per team, including captain<input type="number" id="perTeam" min="3" max="12" step="1" value="5"></label>
      <div class="hint" id="perTeamHint"></div>
      <label>Player parity (spread of overall ratings)<input type="number" id="parity" min="0" max="1" step="0.1" value="0"></label>
      <div class="hint">0 means every draftable kid averages exactly 3. At 0.5, most kids land between 2.5 and 3.5. Max 1.0.</div>
    </div>
  </div>
  <div class="err" id="setupErr"></div>
  <button id="toDraftBtn">Go to draft</button>
</section>

<section id="draft" class="screen">
  <div id="draftStatus"></div>
  <div class="draftWrap">
    <div class="teamCol"><h3 id="hdrRed"></h3><div class="roster" id="rosterRed"></div></div>
    <div><div style="margin-bottom:10px;font-size:14px">Sort by <select id="sortSel" style="font:inherit;padding:4px 6px;border-radius:6px;border:1px solid #b8c4ad"></select></div><div class="pool" id="pool"></div><div style="margin-top:14px"><button id="startBtn" disabled>Start game</button></div></div>
    <div class="teamCol"><h3 id="hdrBlue"></h3><div class="roster" id="rosterBlue"></div></div>
  </div>
</section>

<section id="game" class="screen">
  <div class="controls">
    <button data-speed="0">Pause</button><button data-speed="1" class="on">1x</button><button data-speed="2">2x</button><button data-speed="4">4x</button>
    <span style="width:16px"></span>
    <button id="rematchTop">Rematch</button><button id="redraftTop">Redraft</button><button id="setupTop">New setup</button><button id="statsTop" style="display:none">View match stats</button>
    <span style="margin-left:12px;color:#667;font-size:13px">Hover a player to see their card.</span>
  </div>
  <div class="gameWrap">
    <canvas id="cv" width="1000" height="620"></canvas>
    <div id="log"></div>
  </div>
</section>

<div id="tip" class="card"></div>
<div id="overlay"><div class="box" id="overBox"></div></div>

<script>
// ---------- Setup and draft ----------
const SKILLS=[['speed','Speed'],['agility','Agility'],['tPower','Throw power'],['tAcc','Throw accuracy'],['tFin','Throw finesse'],['cPower','Catch power'],['cFin','Catch finesse'],['aware','Awareness']];
const NAMES=['Maya','Leo','Ava','Jayden','Zoe','Marcus','Priya','Sam','Nora','Eli','Jada','Owen','Lily','Mateo','Harper','Theo','Rosa','Kai','Ivy','Dante','Mila','Finn','Aisha','Max','Ruby','Omar','Quinn','Hugo','Tess','Ben'];
const $=id=>document.getElementById(id);
const logEl=$('log'),tip=$('tip'),overlay=$('overlay'),overBox=$('overBox');
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// Draftable kids: 8 skills (1-5) each. Overall average is 3 plus random spread set by the parity setting
// (clamped to 1.5-4.5), and no two kids have the same skill profile
function makeKids(n,sd){
  const seen=new Set(),kids=[],names=shuffle(NAMES.slice());let tries=0;
  while(kids.length<n){
    tries++;
    const total=Math.round(clamp(3+gauss()*sd,1.5,4.5)*8);
    const s=Array(8).fill(Math.floor(total/8));
    shuffle([0,1,2,3,4,5,6,7]).slice(0,total%8).forEach(i=>s[i]++);
    const moves=6+Math.floor(Math.random()*6);
    for(let m=0;m<moves;m++){const i=Math.floor(Math.random()*8),j=Math.floor(Math.random()*8);if(i!==j&&s[i]>1&&s[j]<5){s[i]--;s[j]++;}}
    const key=s.join('');
    if(tries<5000&&(seen.has(key)||s.every(v=>v===s[0])))continue;
    seen.add(key);
    const stats={};SKILLS.forEach(([k],i)=>stats[k]=s[i]);
    kids.push({name:names[kids.length],stats,captain:false,lean:rollLean(stats),hand:rollHand()});
  }
  return kids;
}
// About 1 in 8 kids is left-handed
function rollHand(){return Math.random()<0.125?'left':'right';}
// Instinct: every kid leans toward catching or dodging; good hands make "catch" more likely
function rollLean(st){return Math.random()<clamp(0.5+0.12*((st.cPower+st.cFin)/2-st.agility),0.15,0.85)?'catch':'dodge';}
function makeCaptain(name){const stats={};SKILLS.forEach(([k])=>stats[k]=4);return {name,stats,captain:true,lean:rollLean(stats),hand:rollHand()};}
const overall=p=>SKILLS.reduce((s,[k])=>s+p.stats[k],0)/8;
function tagline(p){
  if(p.captain)return 'Captain · 4 in every skill';
  const arr=SKILLS.map(([k,l])=>[l,p.stats[k]]).sort((a,b)=>b[1]-a[1]);
  return `Overall ${overall(p).toFixed(2)} · Best at: ${arr[0][0]}, ${arr[1][0]}`;
}
function cardHTML(p){
  return `<div class="nm">${p.name}${p.captain?' ★':''}</div><div class="tag">${tagline(p)}<br>Instinct: <b>${p.lean==='catch'?'Catch first':'Dodge first'}</b> · Throws: <b>${p.hand==='left'?'Left':'Right'}</b></div>`+
    SKILLS.map(([k,l])=>`<div class="stat"><span>${l}</span><span class="pips">${[1,2,3,4,5].map(n=>`<span class="${n<=p.stats[k]?'f':''}"></span>`).join('')}</span></div>`).join('');
}

// ---------- Game setup ----------
// Internally the user's team is 'red' and the CPU's team is 'blue'; COL and LABEL hold the chosen colors
const PRESETS=[['Red','#d64545'],['Blue','#3b6fd6'],['Orange','#e07b2a'],['Purple','#8a4fc7'],['Teal','#1f9e8f'],['Pink','#d9529b']];
const SET={you:{name:'Riley',color:0},cpu:{name:'Blake',color:1},perTeam:5,sd:0};
const COL={red:PRESETS[0][1],blue:PRESETS[1][1]},LABEL={red:PRESETS[0][0],blue:PRESETS[1][0]};
const cleanName=(s,d)=>(s||'').replace(/[<>&"']/g,'').trim().slice(0,14)||d;
function renderSetup(){
  ['you','cpu'].forEach(who=>{
    const el=$(who+'Colors'),other=who==='you'?'cpu':'you';el.innerHTML='';
    PRESETS.forEach(([n,c],i)=>{
      const b=document.createElement('button');b.style.background=c;b.title=n;
      b.className=SET[who].color===i?'sel':'';b.disabled=SET[other].color===i;
      b.onclick=()=>{SET[who].color=i;renderSetup();};el.appendChild(b);
    });
    $(who+'ColorName').textContent='Team color: '+PRESETS[SET[who].color][0];
  });
  updatePerTeamHint();
}
function updatePerTeamHint(){
  const n=parseInt($('perTeam').value,10);
  $('perTeamHint').textContent=n>=3&&n<=12?`${n} vs ${n}, with ${2*(n-1)} kids in the draft.`:'Pick a number from 3 to 12.';
}
function goToDraft(){
  const n=parseInt($('perTeam').value,10),sd=parseFloat($('parity').value);
  if(!(n>=3&&n<=12)){$('setupErr').textContent='Players per team must be a whole number from 3 to 12.';return;}
  if(!(sd>=0&&sd<=1)){$('setupErr').textContent='Player parity must be between 0 and 1.0.';return;}
  $('setupErr').textContent='';
  SET.perTeam=n;SET.sd=sd;
  SET.you.name=cleanName($('youName').value,'Riley');SET.cpu.name=cleanName($('cpuName').value,'Blake');
  COL.red=PRESETS[SET.you.color][1];LABEL.red=PRESETS[SET.you.color][0];
  COL.blue=PRESETS[SET.cpu.color][1];LABEL.blue=PRESETS[SET.cpu.color][0];
  document.documentElement.style.setProperty('--red',COL.red);
  newDraft();
}
function showSetup(){G=null;overlay.style.display='none';showScreen('setup');renderSetup();}

// The CPU ranks kids by how much it values each skill
const CPU_W={speed:1.0,agility:1.15,tPower:1.2,tAcc:1.1,tFin:0.8,cPower:1.1,cFin:0.8,aware:1.3};
let pool=[],teams={red:[],blue:[]},turn='red',draftLog='',draftSort='overall';
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));}
function newDraft(){
  G=null;overlay.style.display='none';
  pool=makeKids(2*(SET.perTeam-1),SET.sd);
  teams={red:[makeCaptain('Captain '+SET.you.name)],blue:[makeCaptain('Captain '+SET.cpu.name)]};
  turn=Math.random()<.5?'red':'blue';
  draftLog=`Coin flip: ${turn==='red'?'you pick':LABEL.blue+' picks'} first.`;
  showScreen('draft');renderDraft();
  if(turn==='blue')setTimeout(cpuPick,900);
}
function cpuValue(p){return SKILLS.reduce((s,[k])=>s+CPU_W[k]*p.stats[k],0);}
function cpuPick(){
  const ranked=pool.slice().sort((a,b)=>cpuValue(b)-cpuValue(a));
  let pick=ranked[0];
  // 30% of the time the CPU goes with its 2nd or 3rd favorite instead
  if(ranked.length>1&&Math.random()<0.3)pick=ranked[1+Math.floor(Math.random()*Math.min(2,ranked.length-1))];
  draftPick(pick,'blue');
}
function draftPick(p,team){
  pool.splice(pool.indexOf(p),1);teams[team].push(p);
  draftLog=`${team==='red'?'You picked':LABEL.blue+' picked'} ${p.name}.`;
  turn=team==='red'?'blue':'red';
  renderDraft();
  if(pool.length&&turn==='blue')setTimeout(cpuPick,900);
}
function renderDraft(){
  const done=!pool.length;
  $('draftStatus').textContent=draftLog+' '+(done?'Teams are set. Start the game when you are ready.':turn==='red'?'Your pick: click a kid.':LABEL.blue+' is picking…');
  $('hdrRed').textContent=LABEL.red+' (You)';$('hdrRed').style.color=COL.red;
  $('hdrBlue').textContent=LABEL.blue+' (CPU)';$('hdrBlue').style.color=COL.blue;
  ['red','blue'].forEach(t=>{
    const el=$(t==='red'?'rosterRed':'rosterBlue');el.innerHTML='';
    teams[t].forEach(p=>{const d=document.createElement('div');d.textContent=p.name+(p.captain?' ★':'');d.onmousemove=e=>showTip(p,e);d.onmouseleave=hideTip;el.appendChild(d);});
  });
  const poolEl=$('pool');poolEl.innerHTML='';
  // Highest first by the chosen stat; ties fall back to overall, then name
  const key=p=>draftSort==='overall'?overall(p):p.stats[draftSort];
  pool.slice().sort((a,b)=>key(b)-key(a)||overall(b)-overall(a)||a.name.localeCompare(b.name)).forEach(p=>{
    const d=document.createElement('div');d.className='card'+(turn==='red'?' pickable':'');d.innerHTML=cardHTML(p);
    d.onclick=()=>{if(turn==='red')draftPick(p,'red');};poolEl.appendChild(d);
  });
  $('startBtn').disabled=!done;
}

// ---------- Game engine ----------
const W=1000,H=620,CT={x0:50,x1:950,y0:60,y1:500},MID=500,PR=12,BR=6,GAME_LEN=300,HOLD_MAX=5;
let G=null,simSpeed=1;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function gauss(){return Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());}
const fwdSpd=p=>55+28*p.s.speed;      // Speed: forward/back running (toward or away from the line)
const latSpd=p=>45+26*p.s.agility;    // Agility: side-to-side movement
const minX=p=>p.team==='red'?CT.x0+PR:MID+PR;
const maxX=p=>p.team==='red'?MID-PR:CT.x1-PR;
const opp=t=>t==='red'?'blue':'red';
const inPlayers=team=>G.players.filter(p=>p.team===team&&p.state==='in');
const canReach=(b,team)=>team==='red'?b.x<=MID+8:b.x>=MID-8;
// Dotted lines sit 80% of the way from each end line to the midline
const DOT={red:CT.x0+0.8*(MID-CT.x0),blue:CT.x1-0.8*(CT.x1-MID)};
const behindDot=p=>p.team==='red'?p.x<=DOT.red:p.x>=DOT.blue;
// Finesse throws are slower and easier to catch, but spin still rewards good catch finesse
function pCatch(o,b){
  let p=0.5+0.11*(o.s.cPower-b.power)+0.04*(o.s.aware-3);
  if(b.finesse)p+=0.08+0.07*(o.s.cFin-3)*(b.spin/5);
  return clamp(p,0.06,0.92);
}
// Deflecting with a held ball depends only on awareness: 100% at 5, minus 5% per point below
function pBlock(o,b){return 0.75+0.05*o.s.aware;}

function startGame(){
  const players=[];
  ['red','blue'].forEach(team=>teams[team].forEach((base,i,arr)=>{
    players.push({base,name:base.name,s:base.stats,team,
      x:team==='red'?CT.x0+40:CT.x1-40,y:CT.y0+30+i*(CT.y1-CT.y0-60)/(arr.length-1),vx:0,vy:0,
      state:'in',entering:false,ball:null,hold:0,wait:0,target:null,retarget:0,fetch:null,react:null,goal:null,goalT:0,dest:null,
      box:{throws:0,hits:0,catches:0,dodges:0,blocks:0,outs:0}});
  }));
  const balls=[0.25,0.5,0.75].map(f=>({x:MID,y:CT.y0+(CT.y1-CT.y0)*f,vx:0,vy:0,state:'free',holder:null,thrower:null,target:null,power:0,spin:0,curve:0}));
  G={players,balls,time:0,countdown:3,over:false,otLogged:false,queue:{red:[],blue:[]}};
  logEl.innerHTML='';overlay.style.display='none';$('statsTop').style.display='none';
  addLog('Three balls on the center line. Both teams line up for the opening rush.');
  showScreen('game');
}

function step(dt){
  if(G.over)return;
  if(G.countdown>0){G.countdown-=dt;if(G.countdown<=0)addLog('Go! The opening rush is on.');return;}
  G.time+=dt;
  assignFetchers('red');assignFetchers('blue');
  G.players.forEach(p=>updatePlayer(p,dt));
  G.balls.forEach(b=>updateBall(b,dt));
  checkEnd();
}

// Nearest free player on each side goes after each loose ball
function assignFetchers(team){
  const mine=inPlayers(team);mine.forEach(p=>p.fetch=null);
  const avail=mine.filter(p=>!p.ball&&!p.entering&&!(p.react&&p.react.mode));
  G.balls.filter(b=>b.state==='free'&&canReach(b,team)).forEach(b=>{
    let best=null,bd=1e9;
    avail.forEach(p=>{if(p.fetch)return;const d=dist(p,b);if(d<bd){bd=d;best=p;}});
    if(best)best.fetch=b;
  });
}

function closestPoint(b,p){
  const vv=b.vx*b.vx+b.vy*b.vy||1;
  const t=Math.max(0,((p.x-b.x)*b.vx+(p.y-b.y)*b.vy)/vv);
  const x=b.x+b.vx*t,y=b.y+b.vy*t;
  return {x,y,t,d:Math.hypot(p.x-x,p.y-y)};
}
function findThreat(p){
  for(const b of G.balls){
    if(b.state!=='fly'||b.thrower.team===p.team)continue;
    const c=closestPoint(b,p);
    if(c.t>0&&c.t<1.7&&c.d<PR+BR+22)return b;
  }
  return null;
}

function steer(p,tx,ty,f,dt,inCourt){
  let dx=tx-p.x,dy=ty-p.y,vx=0,vy=0;const l=Math.hypot(dx,dy);
  if(l>3){
    dx/=l;dy/=l;const slow=Math.min(1,l/25);
    vx=dx*(inCourt?fwdSpd(p):120)*f*slow;vy=dy*(inCourt?latSpd(p):120)*f*slow;
  }
  const k=Math.min(1,(3+1.6*p.s.agility)*dt);  // Agility also controls how fast they change direction
  p.vx+=(vx-p.vx)*k;p.vy+=(vy-p.vy)*k;
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(inCourt){p.x=clamp(p.x,minX(p),maxX(p));p.y=clamp(p.y,CT.y0+PR,CT.y1-PR);}
}

function updatePlayer(p,dt){
  if(p.state==='out'){steer(p,p.dest.x,p.dest.y,1,dt,false);return;}
  if(p.entering){
    steer(p,clamp(p.x,minX(p),maxX(p)),CT.y1-PR-20,1,dt,false);
    if(p.y<CT.y1-PR-2)p.entering=false;
    return;
  }
  // Awareness: how quickly a player notices a ball coming at them
  // Finesse throws catch players off guard: they take longer to read
  if(!p.react){const b=findThreat(p);if(b)p.react={ball:b,t:0,delay:Math.max(0.04,0.30-0.05*p.s.aware+rand(-0.04,0.06)+(b.finesse?0.05*b.spin:0)),mode:null,think:0,rethought:false};}
  if(p.react){
    const r=p.react,b=r.ball;
    if(b.state!=='fly')p.react=null;
    else{
      r.t+=dt;
      // First instinct: do whatever they lean toward. Holding a ball, "catch first" kids go to deflect instead
      if(!r.mode&&r.t>=r.delay)r.mode=p.ball?(p.base.lean==='catch'?'block':'dodge'):p.base.lean;
      // With time to think, they reconsider; aware players think faster and judge better
      if(r.mode&&!r.rethought){
        r.think+=dt;
        if(r.think>=0.35-0.04*p.s.aware){
          r.rethought=true;
          if(closestPoint(b,p).t>0.12){
            const noise=rand(-1,1)*(0.32-0.055*p.s.aware);
            r.mode=p.ball?(pBlock(p,b)+noise>0.5?'block':'dodge'):(pCatch(p,b)+noise>0.55?'catch':'dodge');
          }
        }
      }
      if(r.mode){
        const c=closestPoint(b,p);
        if(r.mode==='catch'||r.mode==='block')steer(p,c.x,c.y,1,dt,true);
        else{
          let dx=p.x-c.x,dy=p.y-c.y,l=Math.hypot(dx,dy);
          if(l<1){dx=0;dy=p.y<(CT.y0+CT.y1)/2?1:-1;l=1;}
          steer(p,p.x+dx/l*80,p.y+dy/l*80,1.4,dt,true);
        }
        if(p.ball)holdTick(p,dt,false);
        return;
      }
    }
  }
  if(p.ball){holdTick(p,dt,true);return;}
  if(p.fetch){
    const b=p.fetch;
    if(b.state==='free'&&dist(p,b)<PR+BR+5){pickUp(p,b);return;}
    steer(p,b.x,b.y,1,dt,true);return;
  }
  wander(p,dt);
}

function wander(p,dt){
  p.goalT-=dt;
  if(!p.goal||p.goalT<=0){
    // Players without a ball hang back behind their dotted line, deeper when the other side is armed
    const threat=inPlayers(opp(p.team)).some(o=>o.ball);
    const lineGap=Math.abs(MID-DOT[p.team]);
    const depth=lineGap+10+(threat?rand(60,200)+p.s.aware*10:rand(0,150));
    p.goal={x:clamp(p.team==='red'?MID-depth:MID+depth,minX(p),maxX(p)),y:rand(CT.y0+30,CT.y1-30)};
    p.goalT=rand(0.8,2);
  }
  steer(p,p.goal.x,p.goal.y,0.6,dt,true);
}

function pickUp(p,b){
  Object.assign(b,{state:'held',holder:p,vx:0,vy:0});
  p.ball=b;p.fetch=null;p.hold=0;p.target=null;p.live=behindDot(p);
  p.wait=rand(0.3,0.8)+p.s.aware*0.35;   // aware players are more patient for a good shot
  if(G.time<5)addLog(`${nm(p)} wins the race to a ball.`);
}

// Aware players go after distracted, slow-reacting targets; others pick more randomly
function pickTarget(p){
  const os=inPlayers(opp(p.team)).filter(o=>!o.entering);
  if(!os.length)return null;
  const aw=p.s.aware;let best=null,bs=-1e9;
  os.forEach(o=>{
    const vul=(o.fetch?0.5:0)+(o.react?-0.4:0)+(5-o.s.agility)*0.08+(5-o.s.aware)*0.08+(o.ball?0:0.1);
    const sc=-dist(p,o)/350+vul*(aw/5)+Math.random()*(1.4-0.22*aw);
    if(sc>bs){bs=sc;best=o;}
  });
  return best;
}

function holdTick(p,dt,canMove){
  // A ball isn't live until its holder has been behind their dotted line; the 5-second count starts then
  if(!p.live){
    if(behindDot(p)){p.live=true;p.hold=0;}
    else{if(canMove)steer(p,DOT[p.team]+(p.team==='red'?-25:25),p.y,1,dt,true);return;}
  }
  p.hold+=dt;p.retarget-=dt;
  const t0=p.target;
  if(!t0||t0.state!=='in'||t0.entering||p.retarget<=0){p.target=pickTarget(p);p.retarget=0.6;}
  const t=p.target;if(!t)return;
  if(canMove){const dir=p.team==='red'?1:-1;steer(p,MID-dir*(PR+30+(5-p.s.aware)*6),p.y+(t.y-p.y)*0.35,1,dt,true);}
  if(p.hold>=HOLD_MAX-0.15){addLog(`${nm(p)} hits the 5-second limit and rushes a throw.`);throwAt(p,t);return;}
  if(!canMove)return;
  const d=dist(p,t),range=260+40*p.s.tPower;
  if((p.hold>=p.wait&&d<range)||(p.s.aware>=3&&p.hold>0.35&&t.fetch&&d<range)||p.hold>=p.wait+1.6)throwAt(p,t);
}

function throwAt(p,t){
  // Power throw or finesse throw: kids favor their stronger skill; aware throwers use finesse on dodgers
  let pf=0.5+0.15*(p.s.tFin-p.s.tPower);
  if(p.s.aware>=4)pf+=t.base.lean==='dodge'?0.2:-0.2;
  const finesse=Math.random()<clamp(pf,0.1,0.9);
  const power=finesse?p.s.tPower*0.8:p.s.tPower;
  const b=p.ball,sp=290+75*power;                 // Throw power: ball speed
  const tt=dist(p,t)/sp,lead=p.s.aware/5;         // Awareness: leading a moving target
  const ax=t.x+t.vx*tt*lead,ay=t.y+t.vy*tt*lead;
  let ang=Math.atan2(ay-p.y,ax-p.x)+gauss()*(0.22-0.032*p.s.tAcc);  // Throw accuracy: aim error
  // Finesse throws fly straight for the first 60% of the way, then bend about 15° over the last 40%:
  // right-handers curve right, left-handers curve left. The thrower aims slightly the other way
  // (about a fifth of the bend) so the late break lands on the target
  const sign=p.base.hand==='left'?-1:1,total=finesse?(15+rand(-2,2))*Math.PI/180:0;
  if(finesse)ang-=sign*total*0.2;
  Object.assign(b,{state:'fly',holder:null,thrower:p,target:t,power,spin:finesse?p.s.tFin:0,finesse,rot:0,
    turnSign:sign,turnTotal:total,turned:0,fly:0,bendStart:tt*0.6,curveRate:total/Math.max(0.08,tt*0.4),
    vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,x:p.x+Math.cos(ang)*(PR+BR+1),y:p.y+Math.sin(ang)*(PR+BR+1)});
  p.ball=null;p.hold=0;p.target=null;p.box.throws++;
}

function updateBall(b,dt){
  if(b.state==='held'){const h=b.holder;b.x=h.x+(h.team==='red'?1:-1)*(PR+2);b.y=h.y+4;return;}
  if(b.state==='free'){
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    const f=Math.exp(-2.5*dt);b.vx*=f;b.vy*=f;
    if(Math.hypot(b.vx,b.vy)<6)b.vx=b.vy=0;
    if(b.x<CT.x0+BR){b.x=CT.x0+BR;b.vx=Math.abs(b.vx)*0.3;}
    if(b.x>CT.x1-BR){b.x=CT.x1-BR;b.vx=-Math.abs(b.vx)*0.3;}
    if(b.y<CT.y0+BR){b.y=CT.y0+BR;b.vy=Math.abs(b.vy)*0.3;}
    if(b.y>CT.y1-BR){b.y=CT.y1-BR;b.vy=-Math.abs(b.vy)*0.3;}
    return;
  }
  // Finesse throws break late toward the thrower's hand side until they've turned ~15°; power throws fly straight
  // (canvas y points down, so a positive angle change is a right turn from the thrower's view)
  b.fly+=dt;
  if(b.finesse&&b.fly>=b.bendStart&&b.turned<b.turnTotal){
    const step=Math.min(b.curveRate*dt,b.turnTotal-b.turned),na=Math.atan2(b.vy,b.vx)+b.turnSign*step,sp=Math.hypot(b.vx,b.vy);
    b.turned+=step;b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
  }
  if(b.finesse)b.rot+=b.turnSign*b.spin*4*dt;
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  for(const o of G.players){
    if(o.team===b.thrower.team||o.state!=='in'||o.entering)continue;
    if(dist(o,b)<PR+BR){contact(b,o);return;}
  }
  if(b.x<CT.x0||b.x>CT.x1||b.y<CT.y0||b.y>CT.y1){
    b.x=clamp(b.x,CT.x0+BR,CT.x1-BR);b.y=clamp(b.y,CT.y0+BR,CT.y1-BR);
    b.vx*=-0.15;b.vy*=-0.15;endFlight(b,null);
  }
}

// A thrown ball that touches a player is a deflection, a catch, or a hit. Ricochets are loose balls
// that can't hit anyone or be caught for an out
function contact(b,o){
  const th=b.thrower;
  const tryBlock=o.react&&o.react.ball===b&&o.react.mode==='block'&&o.ball;
  if(tryBlock&&Math.random()<pBlock(o,b)){
    const a=rand(0,Math.PI*2),sp=rand(180,320);
    b.x=o.x+Math.cos(a)*(PR+BR+2);b.y=o.y+Math.sin(a)*(PR+BR+2);b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;
    endFlight(b,o);o.box.blocks++;
    addLog(`${nm(o)} deflects ${nm(th)}'s throw with their ball.`);
    return;
  }
  const tryCatch=o.react&&o.react.ball===b&&o.react.mode==='catch';
  if(tryCatch&&Math.random()<pCatch(o,b)){
    endFlight(b,o);
    Object.assign(b,{state:'held',holder:o,vx:0,vy:0});
    o.ball=b;o.hold=0;o.target=null;o.live=behindDot(o);o.wait=rand(0.3,0.8)+o.s.aware*0.35;o.box.catches++;
    const back=returnPlayer(o.team);
    addLog(`${nm(o)} catches ${nm(th)}'s throw! ${nm(th)} is out${back?`, and ${nm(back)} comes back in`:''}.`);
    knockOut(th);
  }else{
    th.box.hits++;
    b.vx=-b.vx*0.15+rand(-40,40);b.vy=rand(-60,60);
    endFlight(b,o);
    addLog(tryBlock?`${nm(o)} tries to deflect ${nm(th)}'s throw but gets hit and is out.`:tryCatch?`${nm(o)} can't hang on to ${nm(th)}'s throw and is out.`:`${nm(th)} hits ${nm(o)}. ${nm(o)} is out.`);
    knockOut(o);
  }
}

function endFlight(b,touched){
  const t=b.target,th=b.thrower;
  if(t&&t!==touched&&t.state==='in'&&t.react&&t.react.ball===b&&t.react.mode==='dodge'){
    t.box.dodges++;addLog(`${nm(t)} dodges ${nm(th)}'s throw.`);
  }
  G.players.forEach(p=>{if(p.react&&p.react.ball===b)p.react=null;});
  Object.assign(b,{state:'free',thrower:null,target:null,holder:null});
}

function knockOut(p){
  if(p.state==='out')return;
  if(p.ball){Object.assign(p.ball,{state:'free',holder:null,vx:rand(-30,30),vy:rand(-30,30)});p.ball=null;}
  Object.assign(p,{state:'out',entering:false,react:null,fetch:null,target:null});
  p.box.outs++;
  G.queue[p.team].push(p);setQueueDests(p.team);
}
// Sideline spacing shrinks with bigger teams so a full queue still fits
function setQueueDests(team){
  const sp=Math.min(42,400/Math.max(1,teams[team].length-1));
  G.queue[team].forEach((p,i)=>p.dest={x:team==='red'?MID-30-i*sp:MID+30+i*sp,y:CT.y1+52});
}
// First out, first back in
function returnPlayer(team){
  const q=G.queue[team];if(!q.length)return null;
  const r=q.shift();r.state='in';r.entering=true;r.hold=0;r.goal=null;
  setQueueDests(team);return r;
}

function checkEnd(){
  const r=inPlayers('red').length,bl=inPlayers('blue').length;
  if(!r||!bl){finish(r?'red':'blue',`${LABEL[r?'red':'blue']} knocked out the whole ${LABEL[r?'blue':'red']} team.`);return;}
  if(G.time>=GAME_LEN){
    if(r!==bl)finish(r>bl?'red':'blue',`Time ran out with ${Math.max(r,bl)} players left against ${Math.min(r,bl)}.`);
    else if(!G.otLogged){G.otLogged=true;addLog(`<b>Time!</b> Tied ${r} to ${bl}. Sudden death: the next out decides it.`);}
  }
}

// ---------- Rendering and UI ----------
const cv=$('cv'),ctx=cv.getContext('2d');
let hoverP=null;
function fmt(t){t=Math.max(0,t);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');}
function nm(p){return `<b style="color:${COL[p.team]}">${p.name}</b>`;}
function addLog(html){
  const d=document.createElement('div');
  d.innerHTML=`<span class="t">${fmt(G?G.time:0)}</span>${html}`;
  logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;
}

function render(){
  ctx.fillStyle='#c9d8b6';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(CT.x0,CT.y0,CT.x1-CT.x0,CT.y1-CT.y0);
  ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(MID,CT.y0);ctx.lineTo(MID,CT.y1);ctx.stroke();
  ctx.lineWidth=2;ctx.setLineDash([8,8]);ctx.beginPath();
  ctx.moveTo(DOT.red,CT.y0);ctx.lineTo(DOT.red,CT.y1);ctx.moveTo(DOT.blue,CT.y0);ctx.lineTo(DOT.blue,CT.y1);
  ctx.stroke();ctx.setLineDash([]);
  ctx.textAlign='center';ctx.font='12px sans-serif';ctx.fillStyle='rgba(43,51,39,.55)';
  ctx.fillText(LABEL.red+' sideline (out)',MID-200,CT.y1+90);ctx.fillText(LABEL.blue+' sideline (out)',MID+200,CT.y1+90);
  // scoreboard
  const r=inPlayers('red').length,bl=inPlayers('blue').length;
  ctx.font='bold 18px sans-serif';
  ctx.textAlign='left';ctx.fillStyle=COL.red;ctx.fillText(`${LABEL.red.toUpperCase()}  ${r} in`,CT.x0,38);
  ctx.textAlign='right';ctx.fillStyle=COL.blue;ctx.fillText(`${bl} in  ${LABEL.blue.toUpperCase()}`,CT.x1,38);
  ctx.textAlign='center';ctx.fillStyle='#2b3327';
  ctx.fillText(G.time>=GAME_LEN?'SUDDEN DEATH':fmt(GAME_LEN-G.time),MID,38);
  // players: sideline first so active players draw on top
  const order=G.players.slice().sort((a,b)=>(a.state==='out')-(b.state==='out')).reverse();
  order.forEach(p=>{
    ctx.globalAlpha=p.state==='out'?0.45:1;
    ctx.beginPath();ctx.arc(p.x,p.y,PR,0,Math.PI*2);ctx.fillStyle=COL[p.team];ctx.fill();
    if(p.base.captain){ctx.strokeStyle='#f2c94c';ctx.lineWidth=3;ctx.stroke();}
    if(p===hoverP){ctx.strokeStyle='#2b3327';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,PR+5,0,Math.PI*2);ctx.stroke();}
    ctx.fillStyle='#2b3327';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(p.name.replace('Captain ',''),p.x,p.y+PR+12);
    if(p.state==='in'&&p.react&&p.react.mode){ctx.font='bold 13px sans-serif';ctx.fillText(p.react.mode==='catch'?'✋':p.react.mode==='block'?'🛡':'!',p.x,p.y-PR-4);}
    ctx.globalAlpha=1;
  });
  // balls
  G.balls.forEach(b=>{
    if(b.state==='fly'){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*0.04,b.y-b.vy*0.04);ctx.stroke();}
    ctx.beginPath();ctx.arc(b.x,b.y,BR,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    if(b.state==='fly'&&!b.finesse){ctx.strokeStyle='#000';ctx.lineWidth=2.5;ctx.stroke();}
    else if(b.state==='fly'){
      // Finesse throw: dotted border that rotates with the spin
      ctx.beginPath();ctx.arc(b.x,b.y,BR,b.rot,b.rot+Math.PI*2);
      ctx.strokeStyle='#2b3327';ctx.lineWidth=2;ctx.setLineDash([2.5,2.5]);ctx.stroke();ctx.setLineDash([]);
    }
    else{ctx.strokeStyle='#7d8a72';ctx.lineWidth=1.2;ctx.stroke();}
  });
  if(G.countdown>0){
    ctx.fillStyle='rgba(43,51,39,.8)';ctx.font='bold 64px sans-serif';ctx.textAlign='center';
    ctx.fillText(Math.ceil(G.countdown),MID,(CT.y0+CT.y1)/2+22);
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(G&&!G.over&&simSpeed>0){
    let t=dt*simSpeed;const h=1/120;
    while(t>0&&!G.over){const s=Math.min(h,t);step(s);t-=s;}
  }
  if(G)render();
  requestAnimationFrame(loop);
}

function showTip(base,e,extra=''){
  tip.innerHTML=cardHTML(base)+extra;tip.style.display='block';
  tip.style.left=Math.min(innerWidth-240,e.clientX+14)+'px';
  tip.style.top=Math.min(innerHeight-280,e.clientY+14)+'px';
}
function hideTip(){tip.style.display='none';}
function boxLine(p){
  const b=p.box;
  return `<div style="margin-top:6px;color:#667">${p.state==='out'?'On the sideline · ':''}Throws ${b.throws} · Hits ${b.hits} · Catches ${b.catches} · Dodges ${b.dodges} · Deflections ${b.blocks}</div>`;
}
cv.addEventListener('mousemove',e=>{
  if(!G)return;
  const rc=cv.getBoundingClientRect(),x=(e.clientX-rc.left)*W/rc.width,y=(e.clientY-rc.top)*H/rc.height;
  hoverP=null;let bd=18;
  G.players.forEach(p=>{const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;hoverP=p;}});
  if(hoverP)showTip(hoverP.base,e,boxLine(hoverP));else hideTip();
});
cv.addEventListener('mouseleave',()=>{hoverP=null;hideTip();});

// MVP: most hits + catches; ties go to most dodges + deflections, then to a winning-team player still on the field
function pickMVP(winner){
  const key=p=>[p.box.hits+p.box.catches,p.box.dodges+p.box.blocks,p.team===winner&&p.state==='in'?1:0,p.team===winner?1:0];
  return G.players.slice().sort((a,b)=>{const ka=key(a),kb=key(b);for(let i=0;i<ka.length;i++)if(ka[i]!==kb[i])return kb[i]-ka[i];return 0;})[0];
}

function finish(winner,reason){
  G.over=true;
  addLog(`<b>${LABEL[winner]} wins!</b> ${reason}`);
  const you=winner==='red';
  const mvp=pickMVP(winner),mb=mvp.box;
  const tbl=team=>`<table><tr><th>${LABEL[team]} (${team==='red'?'You':'CPU'})</th><th>Throws</th><th>Hits</th><th>Catches</th><th>Dodges</th><th>Deflections</th><th>Times out</th><th>Finish</th></tr>`+
    G.players.filter(p=>p.team===team).map(p=>`<tr><td>${nm(p)}${p.base.captain?' ★':''}${p===mvp?' 🏆':''}</td><td>${p.box.throws}</td><td>${p.box.hits}</td><td>${p.box.catches}</td><td>${p.box.dodges}</td><td>${p.box.blocks}</td><td>${p.box.outs}</td><td>${p.state==='in'?'In':'Out'}</td></tr>`).join('')+`</table>`;
  const mvpHTML=`<div style="background:#fdf6dd;border-radius:8px;padding:10px 12px;margin-bottom:12px">🏆 <b>Match MVP:</b> ${nm(mvp)} (${LABEL[mvp.team]}): ${mb.hits} hits, ${mb.catches} catches, ${mb.dodges} dodges, ${mb.blocks} deflections${mvp.state==='in'?', still on the field':''}.</div>`;
  overBox.innerHTML=`<h2 style="margin-top:0;color:${COL[winner]}">${you?'You win!':LABEL.blue+' wins.'}</h2><p>${reason} Game time ${fmt(G.time)}.</p>${mvpHTML}${tbl('red')}${tbl('blue')}
    <button id="rematchBtn">Rematch (same teams)</button> <button id="redraftBtn">Redraft new kids</button> <button id="setupBtn">New setup</button> <button id="closeBtn">Hide match stats</button>`;
  overlay.style.display='flex';$('statsTop').style.display='none';
  $('setupBtn').onclick=showSetup;
  $('rematchBtn').onclick=startGame;$('redraftBtn').onclick=newDraft;$('closeBtn').onclick=()=>{overlay.style.display='none';$('statsTop').style.display='';};
}

document.querySelectorAll('[data-speed]').forEach(btn=>btn.onclick=()=>{
  simSpeed=+btn.dataset.speed;
  document.querySelectorAll('[data-speed]').forEach(b=>b.classList.toggle('on',b===btn));
});
$('startBtn').onclick=startGame;
$('rematchTop').onclick=startGame;
$('redraftTop').onclick=newDraft;
$('setupTop').onclick=showSetup;
$('statsTop').onclick=()=>{overlay.style.display='flex';$('statsTop').style.display='none';};
$('toDraftBtn').onclick=goToDraft;
$('perTeam').oninput=updatePerTeamHint;
$('sortSel').innerHTML='<option value="overall">Overall</option>'+SKILLS.map(([k,l])=>`<option value="${k}">${l}</option>`).join('');
$('sortSel').onchange=e=>{draftSort=e.target.value;renderDraft();};
showSetup();
requestAnimationFrame(loop);
</script>
</body>
